<svg viewBox="0 0 820 487" width="820" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Title: content spans x 29..790, centred on 410 -->
  <text x="410" y="34" font-size="16" fill="#1e293b" text-anchor="middle">KaaS 知识库的四层结构</text>

  <!-- Back layer: the extraction/ file-content panel, x=540..790, y=182..342 -->
  <rect x="540" y="182" width="250" height="160" rx="10"
        fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="550" y="196" font-size="11" fill="#64748b">extraction/ 文件的内容</text>
  <text x="555" y="216" font-size="10" fill="#6b21a8">frontmatter</text>
  <text x="555" y="232" font-size="9" fill="#1e293b">source, source_checksum, extract_model,</text>
  <text x="555" y="245" font-size="9" fill="#1e293b">extract_strategy, summarize_model?,</text>
  <text x="555" y="258" font-size="9" fill="#1e293b">prompt_version, extracted_at,</text>
  <text x="555" y="271" font-size="9" fill="#1e293b">schema_version,</text>
  <text x="555" y="284" font-size="9" fill="#1e293b">summary, topics, connections, counts</text>
  <text x="555" y="300" font-size="10" fill="#6b21a8">body（markdown section）</text>
  <text x="555" y="316" font-size="9" fill="#1e293b">concepts, entities, decisions,</text>
  <text x="555" y="330" font-size="9" fill="#1e293b">action_items, claims</text>

  <!-- Connector layer -->
  <!-- Leader from extraction/ to the content panel (no arrowhead); y=195 falls inside both -->
  <path d="M315,195 L 535,195" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- raw/ → extraction/ : bottom 114+5=119 → top 152-11=141 -->
  <path d="M190,119 L 190,141" fill="none" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <!-- extraction/ → wiki/ : bottom 206+5=211 → top 244-11=233 -->
  <path d="M190,211 L 190,233" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <!-- wiki/ → index/ : bottom 298+5=303 → top 326-11=315 -->
  <path d="M190,303 L 190,315" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box layer -->
  <!-- raw/ x=70..310, y=60..114 -->
  <rect x="70" y="60" width="240" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="190" y="82" font-size="12" fill="#1e40af" text-anchor="middle">raw/</text>
  <text x="190" y="99" font-size="9" fill="#1e40af" text-anchor="middle">每份源文档一个文件（不变）</text>

  <!-- extraction/ x=70..310, y=152..206 -->
  <rect x="70" y="152" width="240" height="54" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="190" y="174" font-size="12" fill="#6b21a8" text-anchor="middle">extraction/</text>
  <text x="190" y="191" font-size="9" fill="#6b21a8" text-anchor="middle">每份 raw 文档一个文件，路径相同</text>

  <!-- wiki/ x=70..310, y=244..298 -->
  <rect x="70" y="244" width="240" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="190" y="266" font-size="12" fill="#166534" text-anchor="middle">wiki/</text>
  <text x="190" y="283" font-size="9" fill="#166534" text-anchor="middle">按类目编译好的文章（不变）</text>

  <!-- index/ x=70..310, y=326..380 -->
  <rect x="70" y="326" width="240" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="190" y="348" font-size="12" fill="#166534" text-anchor="middle">index/</text>
  <text x="190" y="365" font-size="9" fill="#166534" text-anchor="middle">master-index、topic-index、timeline（不变）</text>

  <!-- derived/&lt;slug&gt;/ x=70..310, y=408..462 -->
  <rect x="70" y="408" width="240" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="190" y="430" font-size="12" fill="#b45309" text-anchor="middle">derived/&lt;slug&gt;/</text>
  <text x="190" y="447" font-size="9" fill="#b45309" text-anchor="middle">同样四层</text>

  <!-- Arrow labels -->
  <text x="325" y="128" font-size="10" fill="#6b21a8">extract（LLM）</text>
  <text x="325" y="142" font-size="10" fill="#64748b">每个 文档+模型+prompt 组合一次</text>
  <text x="325" y="220" font-size="10" fill="#166534">classify + write（LLM）</text>
  <text x="325" y="234" font-size="10" fill="#64748b">有状态：依赖当前目录</text>

  <!-- Cross-layer paths, drawn last so they sit above the boxes -->
  <!-- extraction/ → index/ : left edge 70-5=65 → 70-11=59 -->
  <path d="M65,170 C 45,170 45,353 59,353" fill="none" stroke="#64748b" stroke-width="1.5"
        stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <!-- extraction/ → derived/ : left edge 70-5=65 → 70-11=59 -->
  <path d="M65,190 C 18,190 18,435 59,435" fill="none" stroke="#f59e0b" stroke-width="1.5"
        stroke-dasharray="6,4" marker-end="url(#arrow-orange)"/>
  <text x="325" y="362" font-size="10" fill="#64748b">document-index：摘要改为读 extraction/</text>
  <text x="325" y="439" font-size="10" fill="#b45309">按 summary/keys 筛选</text>
</svg>
