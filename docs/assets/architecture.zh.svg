<svg viewBox="0 0 800 460" width="800" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="400" y="32" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="bold">KaaS 开源版架构</text>

  <!-- ===== Web UI 层 ===== -->
  <!-- 虚线分组框 -->
  <rect x="25" y="55" width="750" height="70" rx="10" stroke="#3b82f6" stroke-dasharray="6,4" fill="#f0f9ff" fill-opacity="0.5"/>
  <text x="35" y="69" font-size="11" fill="#3b82f6">Web UI (React + Vite)</text>

  <!-- 页面方框 -->
  <rect x="55" y="80" width="90" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="100" y="102" font-size="12" fill="#1e40af" text-anchor="middle">Chat</text>

  <rect x="170" y="80" width="90" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="215" y="102" font-size="12" fill="#1e40af" text-anchor="middle">Submit</text>

  <rect x="285" y="80" width="90" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="330" y="102" font-size="12" fill="#1e40af" text-anchor="middle">Wiki</text>

  <rect x="400" y="80" width="90" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="445" y="102" font-size="12" fill="#1e40af" text-anchor="middle">Status</text>

  <text x="560" y="102" font-size="10" fill="#64748b" text-anchor="middle">SSE 流式 + 引用溯源</text>

  <!-- ===== Go Backend 层 ===== -->
  <!-- 虚线分组框 -->
  <rect x="25" y="150" width="750" height="155" rx="10" stroke="#f59e0b" stroke-dasharray="6,4" fill="#fffbeb" fill-opacity="0.3"/>
  <text x="35" y="164" font-size="11" fill="#b45309">Go Backend (go-zero)</text>

  <!-- REST API -->
  <rect x="55" y="175" width="160" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="135" y="197" font-size="12" fill="#b45309" text-anchor="middle">REST API</text>

  <!-- Worker Pool 分组 -->
  <rect x="245" y="175" width="340" height="120" rx="8" stroke="#94a3b8" stroke-dasharray="6,4" fill="#f8fafc"/>
  <text x="255" y="189" font-size="11" fill="#64748b">Worker Pool（编译加速）</text>

  <rect x="260" y="200" width="100" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="310" y="222" font-size="12" fill="#b45309" text-anchor="middle">Dispatcher</text>

  <rect x="380" y="200" width="90" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="425" y="222" font-size="12" fill="#b45309" text-anchor="middle">Extract</text>

  <rect x="490" y="200" width="85" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="532" y="222" font-size="12" fill="#b45309" text-anchor="middle">Pipeline</text>

  <rect x="260" y="250" width="150" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="335" y="272" font-size="12" fill="#b45309" text-anchor="middle">Circuit Breaker</text>

  <rect x="430" y="250" width="145" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="502" y="272" font-size="12" fill="#b45309" text-anchor="middle">Lease Recovery</text>

  <!-- Store -->
  <rect x="615" y="175" width="145" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="687" y="197" font-size="12" fill="#b45309" text-anchor="middle">SQLite / MySQL</text>

  <!-- ===== Python AI 层 ===== -->
  <!-- 虚线分组框 -->
  <rect x="25" y="330" width="750" height="105" rx="10" stroke="#a855f7" stroke-dasharray="6,4" fill="#faf5ff" fill-opacity="0.3"/>
  <text x="35" y="344" font-size="11" fill="#6b21a8">Python AI Engine (kb-ai)</text>

  <!-- 4-phase compile -->
  <rect x="55" y="355" width="80" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="95" y="377" font-size="12" fill="#6b21a8" text-anchor="middle">Extract</text>

  <rect x="160" y="355" width="80" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="200" y="377" font-size="12" fill="#6b21a8" text-anchor="middle">Classify</text>

  <rect x="265" y="355" width="80" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="305" y="377" font-size="12" fill="#6b21a8" text-anchor="middle">Write</text>

  <rect x="370" y="355" width="80" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="410" y="377" font-size="12" fill="#6b21a8" text-anchor="middle">Index</text>

  <!-- Wiki 迭代检索 -->
  <rect x="490" y="355" width="120" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="550" y="377" font-size="12" fill="#6b21a8" text-anchor="middle">Wiki 迭代检索</text>

  <!-- LLM Chat -->
  <rect x="635" y="355" width="120" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="695" y="377" font-size="12" fill="#6b21a8" text-anchor="middle">LLM Chat</text>

  <!-- 4-phase arrows -->
  <path d="M140,373 L 149,373" fill="none" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <path d="M245,373 L 254,373" fill="none" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <path d="M350,373 L 359,373" fill="none" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- 标注 -->
  <text x="200" y="420" font-size="10" fill="#64748b" text-anchor="middle">4 阶段编译流水线</text>
  <text x="550" y="420" font-size="10" fill="#64748b" text-anchor="middle">master-index &#x2192; LLM 选页</text>
  <text x="695" y="420" font-size="10" fill="#64748b" text-anchor="middle">SSE + 引用</text>

  <!-- ===== 连接线 ===== -->
  <!-- Web -> Go API -->
  <path d="M135,121 C 135,135 135,159 135,164" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Go API -> Python (HTTP bridge) -->
  <path d="M135,216 C 135,260 135,300 135,326" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="148" y="280" font-size="10" fill="#64748b">HTTP</text>

  <!-- Dispatcher -> Extract -->
  <path d="M365,218 L 369,218" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Extract -> Pipeline -->
  <path d="M475,218 L 479,218" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Worker Pool -> Python compile -->
  <path d="M400,295 C 400,315 300,326 300,344" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- Store 连接：Worker Pool ↔ Store 持久化 -->
  <path d="M585,193 L 613,193" fill="none" stroke="#94a3b8" stroke-dasharray="4,3"/>
  <text x="599" y="211" font-size="8" fill="#94a3b8" text-anchor="middle">持久化</text>

  <!-- Index -> Wiki 迭代检索 -->
  <path d="M455,373 L 479,373" fill="none" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- Wiki 迭代检索 -> LLM Chat -->
  <path d="M615,373 L 624,373" fill="none" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
</svg>
