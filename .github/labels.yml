# The label set for the KaaS open-source repository. Sync it to GitHub when
# activating (see docs/agent-github-ops-runbook.md):
#   gh label create <name> --color <color> --description "<description>"
# L1 automated triage only applies labels that already exist here; it never
# creates a new one.
- name: bug
  color: d73a4a
  description: A confirmed or suspected defect
- name: enhancement
  color: a2eeef
  description: A new feature or an improvement
- name: question
  color: d876e3
  description: A usage question or a request for help
- name: documentation
  color: 0075ca
  description: Documentation
- name: good-first-issue
  color: 7057ff
  description: A good entry point for a new contributor
- name: duplicate
  color: cfd3d7
  description: Duplicates an existing issue
- name: needs-repro
  color: fbca04
  description: Missing reproduction details, awaiting more information
