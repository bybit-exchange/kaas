name: Claude Interactive (@claude)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# contents:write allows file edits and branch creation; no auto-merge (no merge step)
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  claude:
    # Only runs when the comment contains @claude (action also re-checks trigger_phrase internally)
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Checks out the branch from the triggering context. This workflow is gated to write-permission
      # users only, so the injection surface is small.
      # If external users are ever allowed to @claude, switch to checking out only the base branch
      # and never the untrusted PR ref (see docs/agent-github-ops-runbook.md for security guardrails).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials (OIDC -> Bedrock)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Claude
        uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: "true"
          trigger_phrase: "@claude"
          # Only write-permission users may trigger by default; allowed_non_write_users
          # is not set, so external users cannot invoke @claude.
          claude_args: |
            --model ${{ vars.BEDROCK_MODEL_ID }}
            --max-turns 15
