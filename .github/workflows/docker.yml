name: Docker

# The multi-arch build, in one place. A pull request runs it and publishes
# nothing, so a broken Dockerfile fails review instead of a release. Publishing
# lives in docker-publish.yml, which calls this workflow; a called workflow sees
# the caller's github context, so the event check below still tells the two
# paths apart and contributors never see a permanently skipped
# "Publish manifest" check on their pull request.
on:
  pull_request:
  workflow_call:

env:
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    # Native runners per architecture. Under QEMU the pnpm, Go and uv builds
    # would all run translated, which costs far more than the extra runner.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the labels are used here. GHCR reads
      # org.opencontainers.image.source to link the package to this repository
      # and render its README on the package page.
      - name: Compute labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      # On a pull request this only proves the Dockerfile builds. On main or a
      # tag the image is pushed by digest and the caller's merge job assembles
      # the two digests into one manifest list.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Record the digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
