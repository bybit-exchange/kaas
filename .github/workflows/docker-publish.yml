name: Docker publish

# Publishing lives here rather than in docker.yml so that it is never part of a
# pull request's check list. The build itself is docker.yml, called rather than
# copied, so the image a release ships and the image a pull request validates
# come from one definition and cannot drift. That workflow keys publishing off
# github.event_name, which a called workflow inherits from this one.
on:
  push:
    branches: [main]
    tags: ['v*']

env:
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read

jobs:
  # A called workflow's permissions cannot exceed the calling job's, so the
  # packages: write its push needs has to be granted here too.
  build:
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write

  merge:
    name: Publish manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `edge` follows main; `latest` only moves for a stable tag, so the
      # README's advice to pin a release stays true. Excluding refs that contain
      # a hyphen keeps prereleases such as v0.1.0-rc.1 off `latest`.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect what was published
        run: docker buildx imagetools inspect "${IMAGE}:${TAG}"
        env:
          TAG: ${{ steps.meta.outputs.version }}
