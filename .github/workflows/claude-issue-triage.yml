name: Claude Issue Triage

on:
  issues:
    types: [opened]

# Least privilege: read the code, write to issues (labels/comments), and take AWS
# credentials via OIDC.
permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC -> Bedrock)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Claude triage
        uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: "true"
          claude_args: |
            --model ${{ vars.BEDROCK_MODEL_ID }}
            --max-turns 6
            --allowedTools "Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue list:*),Bash(gh issue comment:*),Bash(gh label list:*)"
          prompt: |
            You are triaging issues for the open-source repository KaaS. The issue
            at hand is #${{ github.event.issue.number }}. Be friendly and
            professional, and reply in the language the issue body is written in.
            Do only the following:
            1. Read the issue title and body, then apply the closest-fitting labels
               from the ones that **already exist** in the repository (type:
               bug / enhancement / question / documentation; add good-first-issue if
               it is clearly suitable for a newcomer). Confirm a label exists with
               `gh label list` first -- **use only existing labels, never create one**.
            2. Use `gh issue list` for a rough check for an obvious duplicate of an
               existing issue. If there is one, leave a polite comment naming the
               possible duplicate and its number, and apply the duplicate label.
            3. If it is a bug but is missing "Steps to reproduce", "Environment" or
               "Expected behavior", politely ask for what is missing and apply the
               needs-repro label.
            4. Apply labels with `gh issue edit`; post the follow-up question or the
               duplicate note with `gh issue comment`.
            Hard limits: **do not modify any code, do not close the issue, do not
            apply unrelated labels, and do not run any command other than gh.**
