name: Bug report
description: Report a bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Filling these in helps us reproduce and fix faster.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger it
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Deployment method (docker / local dev), OS, Go/Python/Node version, LLM endpoint type
      placeholder: |
        - Deploy: docker compose
        - OS:
        - Go / Python / Node:
        - LLM endpoint:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
    validations:
      required: false
