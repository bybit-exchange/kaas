name: Feature request
description: Suggest a feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        KaaS is **single-user self-hosted**. Multi-tenant, auth, and admin-console features
        are out of scope — if you want one anyway, describe your use case first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The real problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
