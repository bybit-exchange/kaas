name: Feature request
description: 提议一个新功能或改进 / Suggest a feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        KaaS 是**单用户、自托管**版本。涉及多租户 / 鉴权 / 管理台等超出 scope 的提议，
        请先说明使用场景。/ KaaS is single-user self-hosted; multi-tenant features are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 你遇到的实际问题或场景 / The real problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 设想的方案 / Proposed solution
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 备选 / Alternatives considered
    validations:
      required: false
