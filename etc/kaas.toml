[server]
host = "0.0.0.0"
port = 8080

[storage]
# "sqlite" or "mysql"
driver = "sqlite"
sqlite_path = "./data/kaas.db"
# mysql_dsn = "user:pass@tcp(127.0.0.1:3306)/kaas"
kb_dir = "./data"

[worker]
extract_workers = 4
pipeline_concurrency = 2
poll_interval_ms = 1000
lease_timeout_sec = 300
# Consecutive LLM failures that open the circuit breaker.
cb_failure_threshold = 5
# Seconds the breaker stays open before it admits one half-open probe.
cb_cooldown_sec = 30

[ai]
# Upstream address of a remote MCP (streamable-http) server. Empty leaves the
# /mcp reverse proxy unregistered, i.e. remote MCP disabled. Under a compose
# deployment set this to http://ai-mcp:8082; the KAAS_AI_MCP_URL environment
# variable overrides it.
mcp_url = ""

[ai.daemon]
# kaas spawns this Python daemon at startup and speaks a multiplexed
# stdin/stdout protocol to it.
command = "uv"
args = ["run", "--directory", "py", "kb-ai", "daemon"]
concurrency = 8
warmup_timeout_sec = 30
max_restarts = 5

[ai.mcp]
# Whether to serve the native Go MCP streamable-http endpoint (/mcp). Off by
# default; KAAS_MCP_ENABLED=true overrides it.
enabled = false
# Bearer token checked on /mcp requests. Empty disables the check, which is
# only safe on a private network. KAAS_MCP_TOKEN overrides it.
token = ""
# tools/call request timeout in seconds; on expiry the endpoint returns a
# JSON-RPC internal error.
timeout_sec = 120

[llm]
api_key = ""
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
# summarize_model defaults to model. Set it explicitly to summarize with a
# cheaper or lighter model than `model`.
# summarize_model = ""
# How extraction reads a document. "chunked" (default) sends the document text to
# the structured extractor, splitting only when it exceeds the model window;
# "summarize" summarizes each chunk first and extracts from the joined summaries,
# which is cheaper on long documents and loses detail the summariser drops;
# "auto" picks summarize once a document splits into three or more chunks.
# Both ingestion routes read this one value, so changing it re-extracts every
# document once, at full cost. Override with LLM_EXTRACT_STRATEGY.
extract_strategy = "chunked"

# --- Logging ---
[log]
# level: debug | info | warn | error (default: info)
level = "info"
# format: json | text (default: json)
format = "json"

# --- Upload limits (POST /api/submit/files) ---
# Local deployment: generous limits for convenience.
[upload]
max_body_bytes = 209715200         # 200 MiB — total multipart body limit
max_file_size = 1048576            # 1 MiB — max per text file (.md/.txt/.csv)
max_rich_file_size = 52428800      # 50 MiB — max per rich document (.pdf/.docx/.pptx/...)
max_zip_file_size = 104857600      # 100 MiB — max for a .zip archive
max_files_per_upload = 50          # max top-level files in one request
max_zip_entries = 500              # max entries extracted from a zip
max_zip_extracted_size = 209715200 # 200 MiB — total extracted bytes cap
