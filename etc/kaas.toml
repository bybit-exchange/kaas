[server]
host = "0.0.0.0"
port = 8080

[storage]
# "sqlite" or "mysql"
driver = "sqlite"
sqlite_path = "./data/kaas.db"
# mysql_dsn = "user:pass@tcp(127.0.0.1:3306)/kaas"
kb_dir = "./data"

[worker]
# How many documents the dispatcher runs at once. This is the ceiling on a bulk
# ingest: one queue task carries one document, so it is the only document-level
# parallelism there is. Lower it on a machine or gateway that cannot take 12
# concurrent extractions, and keep ai.daemon.concurrency at or above it (startup
# fails if it is below).
#
# It is not the ceiling on concurrent LLM calls. A document longer than 16,000
# characters splits into chunks and each phase fans out to min(chunks,
# KB_WORKERS) further calls, so the ceiling is the product: 12 x 16 = 192
# in-flight calls at these defaults. That is a ceiling and not a typical load —
# real documents are short, and a 108-document reference corpus averaged 2.8
# chunks, peaking around 34 concurrent calls. KB_WORKERS has no setting here: it
# is read from the environment, which the daemon inherits from this process, so
# export KB_WORKERS to bound the second factor.
extract_workers = 12
pipeline_concurrency = 2
poll_interval_ms = 1000
lease_timeout_sec = 300
# 连续失败多少次后熔断 LLM 调用
cb_failure_threshold = 5
# 熔断后多少秒进入半开试探
cb_cooldown_sec = 30

[ai]
# 远程 MCP（streamable-http）上游地址；留空则不暴露 /mcp 反代（远程 MCP 关闭）。
# compose 下设为 http://ai-mcp:8082（也可用环境变量 KAAS_AI_MCP_URL 覆盖）。
mcp_url = ""

[ai.daemon]
# kaas 启动时自动 spawn Python daemon 进程，通过 stdin/stdout 多路复用协议通信。
command = "uv"
args = ["run", "--directory", "py", "kb-ai", "daemon"]
# Must cover worker.extract_workers, and startup refuses the config if it does
# not: every dispatched document holds a slot for its whole pipeline, so a
# smaller pool here caps ingest instead of the dispatcher. The margin leaves
# room for chat, derive and retrieval calls.
concurrency = 16
warmup_timeout_sec = 30
max_restarts = 5

[ai.mcp]
# 是否启用 Go 原生 MCP streamable-http 端点 (/mcp)。默认关闭。
# 可通过环境变量 KAAS_MCP_ENABLED=true 覆盖。
enabled = false
# Bearer token 验证；空值则不验证（仅限内网部署）。
# 可通过环境变量 KAAS_MCP_TOKEN 覆盖。
token = ""
# tools/call 请求超时（秒），超时返回 JSON-RPC internal error。
timeout_sec = 120

[llm]
api_key = ""
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
# summarize_model 默认与 model 一致；需要使用不同的轻量模型进行摘要时显式设置
# summarize_model = ""
# How extraction reads a document. "chunked" (default) sends the document text to
# the structured extractor, splitting only when it exceeds the model window;
# "summarize" summarizes each chunk first and extracts from the joined summaries,
# which is cheaper on long documents and loses detail the summariser drops;
# "auto" picks summarize once a document splits into three or more chunks.
# Both ingestion routes read this one value, so changing it re-extracts every
# document once, at full cost. Override with LLM_EXTRACT_STRATEGY.
extract_strategy = "chunked"

# --- Logging ---
[log]
# level: debug | info | warn | error (default: info)
level = "info"
# format: json | text (default: json)
format = "json"

# --- Upload limits (POST /api/submit/files) ---
# Local deployment: generous limits for convenience.
[upload]
max_body_bytes = 209715200         # 200 MiB — total multipart body limit
max_file_size = 1048576            # 1 MiB — max per text file (.md/.txt/.csv)
max_rich_file_size = 52428800      # 50 MiB — max per rich document (.pdf/.docx/.pptx/...)
max_zip_file_size = 104857600      # 100 MiB — max for a .zip archive
max_files_per_upload = 50          # max top-level files in one request
max_zip_entries = 500              # max entries extracted from a zip
max_zip_extracted_size = 209715200 # 200 MiB — total extracted bytes cap
